name: Upit Windows

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Unsigned Windows verification
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: cmd/upit-desktop/frontend/package-lock.json
      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis mingw --yes --no-progress
          Add-Content $env:GITHUB_PATH 'C:\Program Files (x86)\NSIS'
          Add-Content $env:GITHUB_PATH 'C:\ProgramData\chocolatey\bin'
      - name: CLI and clean smoke
        shell: bash
        run: bash packaging/command-smoke.sh
      - name: Go tests
        run: go test ./...
      - name: Race tests
        run: go test -race ./...
      - name: Go vet
        run: go vet ./...
      - name: Build unsigned consumer package
        run: make package
      - name: Validate consumer sidecars and output boundaries
        shell: pwsh
        run: |
          $files = @(Get-ChildItem dist/windows -File)
          if ($files.Count -ne 3) { throw 'Expected setup, checksum, and metadata only.' }
          .\packaging\windows\validate.ps1 -InstallerPath dist/windows/upit-windows-x64-0.0.0-setup.exe -Version 0.0.0
      - name: Exercise unsigned installed product
        shell: powershell
        run: |
          .\packaging\windows\native-smoke.ps1 -InstallerPath dist/windows/upit-windows-x64-0.0.0-setup.exe -InstallDirectory (Join-Path $env:RUNNER_TEMP 'Upit unsigned smoke') -AutomatedOnly -EvidencePath hosted-smoke-evidence.json
      - name: Prove failed-build staging cleanup
        shell: pwsh
        run: |
          $prior = $env:GOFLAGS
          $env:GOFLAGS = '-upit-invalid-package-smoke-flag'
          $PSNativeCommandUseErrorActionPreference = $false
          try {
            make package
            $failed = $LASTEXITCODE -ne 0
          } finally { $env:GOFLAGS = $prior }
          if (-not $failed) { throw 'Invalid GOFLAGS must fail the package command.' }
          if (@(Get-ChildItem .build/package -ErrorAction SilentlyContinue).Count -ne 0) { throw 'Failed build leaked private staging.' }
      - name: Upload unsigned consumer artifact
        uses: actions/upload-artifact@v4
        with:
          name: upit-windows-x64-unsigned
          path: dist/windows/
      - name: Upload hosted supporting evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upit-windows-hosted-evidence
          path: hosted-smoke-evidence.json

  release-build:
    name: Protected release package with optional Authenticode
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: windows-latest
    environment: upit-windows-release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: cmd/upit-desktop/frontend/package-lock.json
      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis mingw --yes --no-progress
          Add-Content $env:GITHUB_PATH 'C:\Program Files (x86)\NSIS'
          Add-Content $env:GITHUB_PATH 'C:\ProgramData\chocolatey\bin'
      - name: Build protected SemVer package
        shell: pwsh
        env:
          CERTIFICATE_BASE64: ${{ secrets.UPIT_WINDOWS_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.UPIT_WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if ($env:GITHUB_REF_NAME -notmatch '^v\d+\.\d+\.\d+$') { throw 'A protected SemVer tag is required.' }
          $certificate = Join-Path $env:RUNNER_TEMP 'upit-signing.pfx'
          try {
            if (-not [string]::IsNullOrWhiteSpace($env:CERTIFICATE_BASE64)) {
              [IO.File]::WriteAllBytes($certificate, [Convert]::FromBase64String($env:CERTIFICATE_BASE64))
              $env:WINDOWS_CERTIFICATE_PATH = $certificate
              $env:WINDOWS_CERTIFICATE_PASSWORD = $env:CERTIFICATE_PASSWORD
              $env:WINDOWS_PROTECTED_TAG = $env:GITHUB_REF_NAME
              $env:UPIT_PROTECTED_RELEASE = 'true'
            }
            make package VERSION=$($env:GITHUB_REF_NAME.Substring(1))
            if ($LASTEXITCODE -ne 0) { throw 'Protected package build failed.' }
          } finally {
            Remove-Item -LiteralPath $certificate -Force -ErrorAction SilentlyContinue
          }
      - name: Verify release artifact and optional trust
        shell: powershell
        run: |
          $version = $env:GITHUB_REF_NAME.Substring(1)
          $installer = (Get-Item "dist/windows/upit-windows-x64-$version-setup.exe").FullName
          $metadata = Get-Content "$installer.metadata.json" -Raw | ConvertFrom-Json
          .\packaging\windows\validate.ps1 -InstallerPath $installer -Version $version -Signed:$metadata.signed
          .\packaging\windows\native-smoke.ps1 -InstallerPath $installer -InstallDirectory (Join-Path $env:RUNNER_TEMP 'Upit release smoke') -AutomatedOnly -RequireSignature:$metadata.signed -EvidencePath release-hosted-evidence.json
      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: upit-windows-x64-release-${{ github.run_id }}
          path: dist/windows/
      - name: Upload release trust evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upit-windows-release-hosted-evidence
          path: release-hosted-evidence.json

  native-smoke:
    name: Unsigned Windows 11 x64 Explorer functional gate
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    needs: verify
    runs-on: [self-hosted, Windows, X64, upit-native-smoke]
    environment: upit-windows-native-smoke
    steps:
      - uses: actions/checkout@v4
      - name: Download unsigned functional artifact
        uses: actions/download-artifact@v4
        with:
          name: upit-windows-x64-unsigned
          path: dist/windows/
      - name: Observe actual Explorer and Desktop lifecycle
        shell: powershell
        env:
          UPIT_LEGACY_INSTALLER_PATH: ${{ vars.UPIT_LEGACY_INSTALLER_PATH }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:UPIT_LEGACY_INSTALLER_PATH)) { throw 'Configure a real old packaged installer for the migration gate.' }
          .\packaging\windows\native-smoke.ps1 -InstallerPath dist/windows/upit-windows-x64-0.0.0-setup.exe -InstallDirectory (Join-Path $env:RUNNER_TEMP 'Upit native smoke') -LegacyInstallerPath $env:UPIT_LEGACY_INSTALLER_PATH -EvidencePath native-smoke-evidence.json
          $evidence = Get-Content native-smoke-evidence.json -Raw | ConvertFrom-Json
          if (-not $evidence.success -or -not $evidence.fullAcceptance) { throw 'Native surface and real migration acceptance are incomplete.' }
      - name: Upload native surface evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upit-windows-native-smoke-${{ github.run_id }}
          path: native-smoke-evidence.json

  publish:
    name: Publish one Windows product
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [release-build, native-smoke]
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: upit-windows-x64-release-${{ github.run_id }}
          path: dist/windows/
      - name: Publish setup and sidecars
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $installer = Get-ChildItem dist/windows -Filter '*-setup.exe' | Select-Object -First 1
          if ($null -eq $installer) { throw 'Release installer is missing.' }
          $checksum = Get-Item "$($installer.FullName).sha256"
          $metadata = Get-Item "$($installer.FullName).metadata.json"
          gh release create $env:GITHUB_REF_NAME $installer.FullName $checksum.FullName $metadata.FullName --verify-tag --generate-notes
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
