name: Upit Windows

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  verify:
    name: Unsigned Windows verification
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: cmd/upit-desktop/frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm --prefix cmd/upit-desktop/frontend ci
      - name: Install NSIS build tool
        shell: pwsh
        run: |
          choco install nsis --yes --no-progress
          Add-Content $env:GITHUB_PATH 'C:\Program Files (x86)\NSIS'
      - name: Build CLI for the unified payload
        run: make build
      - name: Build desktop and one-shot helper
        run: make build-desktop
      - name: Run Go tests
        run: go test ./...
      - name: Run Go race tests
        run: go test -race ./...
      - name: Run Go vet
        run: go vet ./...
      - name: Validate unsigned package inputs
        shell: pwsh
        run: .\packaging\windows\validate.ps1 -Version 0.6.0.0 -Publisher 'CN=Upit Development'
      - name: Build unsigned verification package
        shell: pwsh
        run: .\packaging\windows\package.ps1 -Version 0.6.0.0 -Publisher 'CN=Upit Development'
      - name: Upload unsigned artifacts
        uses: actions/upload-artifact@v4
        with:
          name: upit-windows-x64-unsigned
          path: dist/windows/

  signed-build:
    name: Signed protected-tag build and hosted verification
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: windows-latest
    environment: upit-windows-release
    permissions:
      contents: read
    steps:
      - name: Checkout protected tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify protected SemVer tag
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_NAME -notmatch '^v\d+\.\d+\.\d+$') { throw "Unsupported release tag: $env:GITHUB_REF_NAME" }
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: cmd/upit-desktop/frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm --prefix cmd/upit-desktop/frontend ci
      - name: Install NSIS build tool
        shell: pwsh
        run: |
          choco install nsis --yes --no-progress
          Add-Content $env:GITHUB_PATH 'C:\Program Files (x86)\NSIS'
      - name: Build desktop and one-shot helper
        run: make build-desktop
      - name: Build CLI for continuity smoke
        run: make build
      - name: Decode signing certificate
        shell: pwsh
        env:
          CERTIFICATE_BASE64: ${{ secrets.UPIT_WINDOWS_CERTIFICATE_BASE64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CERTIFICATE_BASE64)) { throw 'Signing certificate secret is missing.' }
          [IO.File]::WriteAllBytes((Join-Path $env:RUNNER_TEMP 'upit-signing.pfx'), [Convert]::FromBase64String($env:CERTIFICATE_BASE64))
      - name: Build signed package
        shell: pwsh
        env:
          UPIT_PROTECTED_RELEASE: 'true'
          UPIT_MSIX_PUBLISHER: ${{ secrets.UPIT_MSIX_PUBLISHER }}
          UPIT_WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.UPIT_WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          .\packaging\windows\release.ps1 `
            -Tag $env:GITHUB_REF_NAME `
            -Publisher $env:UPIT_MSIX_PUBLISHER `
            -CertificatePath (Join-Path $env:RUNNER_TEMP 'upit-signing.pfx') `
            -CertificatePassword $env:UPIT_WINDOWS_CERTIFICATE_PASSWORD
      - name: Verify signed consumer installation and cleanup
        shell: pwsh
        run: |
          $installer = Get-ChildItem dist/windows -Filter '*-setup.exe' | Select-Object -First 1
          if ($null -eq $installer -or (Get-AuthenticodeSignature $installer.FullName).Status -ne 'Valid') { throw 'Trusted consumer installer is missing.' }
          $root = Join-Path $env:RUNNER_TEMP 'Upit'
          $process = Start-Process $installer.FullName -ArgumentList "/S /D=$root" -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw 'Consumer installation failed.' }
          $payload = (Get-ItemProperty 'HKCU:\Software\Upit').PayloadPath
          foreach ($name in @('upit.exe','upit-desktop.exe','upit-file-manager.exe','upit-explorer-command.dll','repair\Upit.msix')) {
            if ((Get-AuthenticodeSignature (Join-Path $payload $name)).Status -ne 'Valid') { throw "Untrusted installed payload: $name" }
          }
          if ($null -eq (Get-AppxPackage -Name 'HungNth.Upit')) { throw 'Consumer installation did not register package identity.' }
          Remove-ItemProperty 'HKCU:\Software\Upit' -Name PayloadPath
          $process = Start-Process (Join-Path $root 'Uninstall.exe') -ArgumentList '/S' -PassThru -Wait
          if ($process.ExitCode -ne 0 -or (Get-AppxPackage -Name 'HungNth.Upit')) { throw 'Consumer uninstall did not remove registration.' }
      - name: Upload signed consumer installer for protected smoke
        uses: actions/upload-artifact@v4
        with:
          name: upit-windows-x64-signed-${{ github.run_id }}
          path: dist/windows/

  native-smoke:
    name: Protected Windows 11 x64 Explorer smoke
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: signed-build
    runs-on: [self-hosted, Windows, X64, upit-native-smoke]
    environment: upit-windows-native-smoke
    permissions:
      contents: read
    steps:
      - name: Checkout protected tag
        uses: actions/checkout@v4
      - name: Download signed consumer installer
        uses: actions/download-artifact@v4
        with:
          name: upit-windows-x64-signed-${{ github.run_id }}
          path: dist/windows/
      - name: Run interactive Windows 11 Explorer smoke
        shell: pwsh
        run: .\packaging\windows\native-smoke.ps1 -InstallerPath (Get-ChildItem dist/windows -Filter '*-setup.exe' | Select-Object -First 1).FullName -InstallDirectory (Join-Path $env:RUNNER_TEMP 'Upit')
      - name: Upload protected native smoke evidence
        uses: actions/upload-artifact@v4
        with:
          name: upit-windows-x64-native-smoke-${{ github.run_id }}
          path: native-smoke-evidence.json

  publish:
    name: Publish signed package
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: native-smoke
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Download signed package
        uses: actions/download-artifact@v4
        with:
          name: upit-windows-x64-signed-${{ github.run_id }}
          path: dist/windows/
      - name: Verify and publish the one-product installer
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $installer = Get-ChildItem dist/windows -Filter '*-setup.exe' | Select-Object -First 1
          if ($null -eq $installer) { throw 'Consumer installer is missing from the signed artifact.' }
          $checksum = Get-Item "$($installer.FullName).sha256" -ErrorAction Stop
          $metadata = Get-Item "$($installer.FullName).metadata.json" -ErrorAction Stop
          $expected = ((Get-Content $checksum.FullName -Raw) -split '\s+')[0]
          $actual = (Get-FileHash -Algorithm SHA256 $installer.FullName).Hash.ToLowerInvariant()
          if ($expected -ne $actual) { throw 'Installer checksum does not match.' }
          gh release create $env:GITHUB_REF_NAME $installer.FullName $checksum.FullName $metadata.FullName --verify-tag --generate-notes
